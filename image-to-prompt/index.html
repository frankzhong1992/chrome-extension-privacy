<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image to Prompt</title>
    <style>
      :root {
        --ink: #1a1d12;
        --muted: #5c574e;
        --accent: #3f4d16;
        --bg: #f7f6f1;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(90% 70% at 10% 0%, #e7efc4, transparent 55%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      [hidden] { display: none !important; }
      main { max-width: 560px; }
      h1 { margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: var(--muted); }
      a {
        display: inline-block;
        margin-top: 12px;
        margin-right: 12px;
        color: var(--accent);
        font-weight: 650;
      }
      .note {
        margin-top: 24px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Image to Prompt</h1>
      <p>
        Chrome extension to right-click a web image and turn it into a drawing
        prompt with your own OpenAI, Claude, or Gemini API key.
      </p>
      <a href="./privacy.html">Privacy Policy</a>
      <a id="store" href="#" hidden>Chrome Web Store</a>
      <p class="note">
        Your API key stays in this browser. The image is sent only to the
        provider you choose: OpenAI, Anthropic, or Google.
      </p>
    </main>
    <script>
      // After publishing, set STORE_URL to your listing URL.
      const STORE_URL = "";
      if (STORE_URL) {
        const a = document.getElementById("store");
        a.href = STORE_URL;
        a.hidden = false;
      }
    </script>
  </body>
</html>
