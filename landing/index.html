<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X Video Downloader</title>
    <style>
      :root {
        --ink: #152033;
        --muted: #5c6b7e;
        --accent: #244878;
        --bg: #f4f6f9;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(90% 70% at 10% 0%, #d9e4f4, transparent 55%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      main { max-width: 560px; }
      h1 { margin: 0 0 8px; letter-spacing: -0.02em; }
      p { color: var(--muted); }
      a {
        display: inline-block;
        margin-top: 12px;
        margin-right: 12px;
        color: var(--accent);
        font-weight: 650;
      }
      .note {
        margin-top: 24px;
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>X Video Downloader</h1>
      <p>
        Chrome extension to download videos from X with quality selection and
        batch save. Not affiliated with X Corp.
      </p>
      <a href="./privacy.html">Privacy Policy</a>
      <a id="store" href="#" hidden>Chrome Web Store</a>
      <p class="note">
        Only download content you have the right to save. Respect copyright and
        X’s Terms of Service.
      </p>
    </main>
    <script>
      // After publishing, set STORE_URL to your listing URL.
      const STORE_URL = "";
      if (STORE_URL) {
        const a = document.getElementById("store");
        a.href = STORE_URL;
        a.hidden = false;
      }
    </script>
  </body>
</html>
